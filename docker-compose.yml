# Local stack: SeaweedFS as an S3-compatible bucket, Postgres, the ingest worker,
# the classifier and the API, each in its own container (the image's default, `all`, runs
# the three in one). IMAP and Jev settings come from .env; the S3 and database
# settings below override anything there.
#
# Runs the Rust build (rust/Dockerfile): a static binary with the same CLI,
# env vars and log output as the Python package.
x-s3-env: &s3-env
  S3_BUCKET: aimap
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: local
  S3_SECRET_ACCESS_KEY: local
  S3_FORCE_PATH_STYLE: "true"
  DATABASE_URL: postgresql://aimap:aimap@postgres:5432/aimap

x-build: &rust-build
  build: { context: ., dockerfile: rust/Dockerfile }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aimap
      POSTGRES_PASSWORD: aimap
      POSTGRES_DB: aimap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aimap"]
      interval: 2s
      retries: 30

  migrate:
    build: *rust-build
    depends_on:
      postgres: { condition: service_healthy }
    environment: *s3-env
    command: ["migrate"]

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  create-bucket:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do  # wait for SeaweedFS to accept requests
          if aws --endpoint-url http://s3:8333 s3api create-bucket --bucket aimap 2>/dev/null; then
            exit 0
          fi
          if aws --endpoint-url http://s3:8333 s3api head-bucket --bucket aimap 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "S3 not ready after 60s" >&2
        exit 1

  worker:
    build: *rust-build
    command: ["run"]
    depends_on:
      create-bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      <<: *s3-env
      LOG_FORMAT: text
    restart: unless-stopped

  classifier:
    build: *rust-build
    command: ["classify"]
    depends_on:
      create-bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      <<: *s3-env
      LOG_FORMAT: text
    restart: unless-stopped

  api:
    build: *rust-build
    command: ["api"]
    depends_on:
      create-bucket: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      <<: *s3-env
      LOG_FORMAT: text
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  s3data:
  pgdata:
