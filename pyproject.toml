[project]
name = "aimap"
version = "0.1.0"
description = "Pulls email over IMAP, archives the raw messages in S3, classifies them and serves them to an app."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "cryptography>=50.0.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "typesafe-sdk>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-auth>=2.35",
    "requests>=2.32",
]

[project.scripts]
aimap = "aimap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
