[project]
name = "aimap"
version = "0.1.0"
description = "Worker that pulls email over IMAP, archives the raw messages in S3, and (next) classifies them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "cryptography>=50.0.1",
]

[project.scripts]
aimap = "aimap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
