[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Apply schema migrations before the new version starts. Safe to run on every
# deploy of either service: it takes an advisory lock and skips applied files.
preDeployCommand = "aimap migrate"
# Background worker: no port, no healthcheck path. Restart if it exits.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
